# Secret scanning for the whole history. CI runs `gitleaks git` with this file on every push and PR.
# Local run: gitleaks git --config .gitleaks.toml --redact .

title = "TherapyLink"

[extend]
useDefault = true

# The v1 app committed a GCP service-account key, Gemini and Maps keys and Firebase config in
# these five commits (2025-03 to 2025-07). They are listed so CI can scan everything that came
# after them. Listing them here does NOT make them safe: the keys stay live until someone revokes
# them in GCP, and the commits stay public until the history is rewritten (ship plan blocker B1).
# Once the company remote holds a history without these commits, delete this block.
[[allowlists]]
description = "Known v1 leaks, pending revocation and history rewrite (B1)"
commits = [
  "b561cf9cafdb4d8a95eb5367c177efee045c14d0",
  "48fd1cc552262b4b7512587889112f0205aa4d85",
  "fd56966f9b5dd964d376803d2c34646b3218345d",
  "964855767bb71d7f5cd6540cae9504703e7282c9",
  "a3162bffaa96d46e0e49aecb670f5ce8c0b86318",
]

# Firebase client config is an identifier, not a secret: it ships inside every build of the app.
# The real control is restricting these keys by package name, SHA-1 and referrer in the GCP
# console and turning on App Check. Only the two API-key rules are silenced, only for this file.
[[allowlists]]
description = "Firebase client options (public by design; restrict in the GCP console)"
targetRules = ["gcp-api-key", "generic-api-key"]
paths = ['''^app/lib/firebase_options\.dart$''']
