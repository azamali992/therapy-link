# Secret scanning for TherapyLink v3. CI runs `gitleaks git` with this file over the whole history
# on every push and PR, and any finding fails the build.
#
# Local runs:
#   gitleaks git --config .gitleaks.toml --redact .      # every commit
#   gitleaks dir --config .gitleaks.toml --redact .      # the working tree, untracked files too
#
# v3 started from a fresh history, so there is no allowlist for old commits. If a secret ever lands
# in a commit, revoke it first. An allowlist entry hides the finding but leaves the key live.

title = "TherapyLink v3"

[extend]
useDefault = true

# Firebase client config is an identifier, not a secret: it ships inside every build of the app.
# The real control is restricting the keys by package name, SHA-1 and API in the GCP console and
# enforcing App Check. All three conditions must hold: one of the two API-key rules, the generated
# options file, and a value shaped like a Google API key.
[[allowlists]]
description = "Firebase client API keys in the generated options file (public by design)"
condition = "AND"
targetRules = ["gcp-api-key", "generic-api-key"]
paths = ['''^app/lib/firebase_options\.dart$''']
regexTarget = "match"
regexes = ['''AIza[0-9A-Za-z_\-]{35}''']

# --- Credentials by content ---------------------------------------------------------------------

[[rules]]
id = "gcp-service-account-json"
description = "Google service-account key (JSON with type service_account)"
regex = '''"type"\s*:\s*"service_account"'''
keywords = ["service_account"]

[[rules]]
id = "signing-password-property"
description = "Keystore password written into a properties or Gradle file"
regex = '''(?i)\b(storePassword|keyPassword)\b\s*[=:]\s*["']?[^\s"'$]{4,}'''
keywords = ["storepassword", "keypassword"]
[[rules.allowlists]]
description = "Gradle reading the value from key.properties or the environment"
regexTarget = "line"
regexes = ['''(keystoreProperties|System\.getenv|providers\.|properties\[|\$\{)''']

# --- Files that must never be committed, whatever they contain ----------------------------------
# These rules fire on the file name alone, so an empty or placeholder copy is flagged too. That is
# deliberate: the fix is to delete the file and keep it in .gitignore, not to allowlist it.

[[rules]]
id = "service-account-file"
description = "Service-account or Firebase Admin credential file"
path = '''(?i)(^|/)[^/]*(service[-_]?account|firebase[-_]adminsdk)[^/]*\.json$'''

[[rules]]
id = "dotenv-file"
description = "Environment file (.env, .env.local, .env.prod, ...)"
path = '''(^|/)\.env(\.[^/]+)?$'''
[[rules.allowlists]]
description = "Committed templates hold placeholder values only"
paths = ['''(^|/)\.env\.(example|sample|template)$''']

[[rules]]
id = "keystore-file"
description = "Keystore or certificate bundle (.jks, .keystore, .p12, .pfx)"
path = '''(?i)\.(jks|keystore|p12|pfx)$'''

[[rules]]
id = "android-key-properties"
description = "Android release signing config (key.properties)"
path = '''(^|/)key\.properties$'''
