name: ci

on:
  push:
    branches: [main, rebuild/v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pydantic typer rich pytest ruff datasets huggingface_hub requests
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: python -m pytest -q

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  # Production runs on Postgres, and the sqlite job above can't see enum, JSON or migration drift
  # there. A fresh database must reach head through alembic alone (no create_all), and the models
  # must match what the migrations build.
  api-postgres:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tl
          POSTGRES_PASSWORD: tl
          POSTGRES_DB: therapylink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tl -d therapylink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TL_DATABASE_URL: postgresql+asyncpg://tl:tl@localhost:5432/therapylink
      # tests/conftest.py runs the suite on this database (migrated by alembic, truncated after
      # each test) instead of in-memory sqlite.
      TL_TEST_DATABASE_URL: postgresql+asyncpg://tl:tl@localhost:5432/therapylink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Migrate an empty database to head
        run: alembic upgrade head
      # Down to nothing and back up: catches enum types, rules and data steps that only fail on
      # Postgres, and proves a bad release can be rolled back.
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head
      - name: Models match the migrations
        run: alembic check
      - run: python -m pytest -q

  # The image production runs: it must build, migrate an empty Postgres through its release entry,
  # serve with TL_ENV=prod, and carry no fixable CRITICAL vulnerability.
  api-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tl
          POSTGRES_PASSWORD: tl
          POSTGRES_DB: therapylink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tl -d therapylink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: therapylink-api:ci
      TL_DATABASE_URL: postgresql+asyncpg://tl:tl@localhost:5432/therapylink
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t "$IMAGE" api
      # --network host: the container reaches the Postgres service on the runner's localhost.
      - name: Release (migrate) against Postgres
        run: docker run --rm --network host -e TL_ENV=prod -e TL_DATABASE_URL "$IMAGE" release
      - name: Serve and answer health checks
        run: |
          docker run -d --name api --network host -e TL_ENV=prod -e TL_DATABASE_URL -e PORT=7860 "$IMAGE" serve
          for _ in $(seq 30); do
            curl -sf http://localhost:7860/health && break
            sleep 1
          done
          curl -sf http://localhost:7860/health
          curl -sf http://localhost:7860/ready
      - name: Server log
        if: always()
        run: docker logs api || true
      # The binary, checksum-pinned like gitleaks below, rather than a third-party action by tag.
      - name: Install trivy
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" trivy
      # --ignore-unfixed: a CRITICAL with no patched package yet can't be acted on here; it would
      # only turn the gate permanently red. Anything with a fix fails the build.
      - name: Scan the image
        run: ./trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.4", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Catches Gradle, plugin and manifest breakage that analyze and test never touch. A debug bundle
  # needs no signing key; release signing is a separate, human-owned step (ship plan B17).
  app-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.4", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build appbundle --debug

  # Whole-history secret scan. Known v1 leaks are listed in .gitleaks.toml until the keys are
  # revoked and the history rewritten (B1); anything new fails the build.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .