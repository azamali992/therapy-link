# CI for TherapyLink v3. Needs no repository secrets: everything runs on the default read-only token.
#
# Each area's jobs run only when its folder (or this file) changes; the secret scan always runs.
# Branch protection should require the single `ci-ok` job, which passes when every job that ran
# passed and treats a job skipped by its path filter as fine.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the comment). Dependabot's
# github-actions entry keeps them current. Tools fetched as binaries are checksum-pinned.
#
# api/tests/test_deploy.py reads this file: keep the `api-image` and `api-postgres` job names and
# the order of the migration steps in `api-postgres`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded runs on PRs and work branches are cancelled. Every commit on main gets a full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      api: ${{ steps.filter.outputs.api }}
      ml: ${{ steps.filter.outputs.ml }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            app:
              - *ci
              - 'app/**'
            api:
              - *ci
              - 'api/**'
              - '.github/dependabot.yml'
            ml:
              - *ci
              - 'ml/**'
              # test_prompt_parity and test_train_guardian compare against these app files
              - 'app/lib/core/ml/**'
              - 'app/lib/features/eve/**'
            workflows:
              - '.github/workflows/**'

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter --version
      - run: flutter pub get
      # Generated code (drift and friends). Conflicting outputs are regenerated, never kept.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      # The app is being built out in parallel, so the test folder may not exist yet. Run whatever
      # tests are there, and say so clearly when there are none.
      - name: flutter test
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "::warning title=app::No *_test.dart files under app/test yet; flutter test skipped"
          fi

  # Catches Gradle, plugin and manifest breakage that analyze and test never touch. A debug build
  # needs no signing key; release signing stays a human-owned step.
  app-build:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/app/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      # A fresh SQLite file must reach head through alembic alone, and the models must match it.
      - name: Migrate an empty SQLite database to head
        env:
          TL_DATABASE_URL: sqlite+aiosqlite:///./ci-migrate.db
        run: |
          alembic upgrade head
          alembic check

  # Production runs on Postgres, and SQLite can't see enum, JSON or migration drift there. A fresh
  # database must reach head through alembic alone (no create_all), go back down to nothing and up
  # again, and the models must match what the migrations build. Then the suite runs on Postgres.
  api-postgres:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tl
          POSTGRES_PASSWORD: tl
          POSTGRES_DB: therapylink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tl -d therapylink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TL_DATABASE_URL: postgresql+asyncpg://tl:tl@localhost:5432/therapylink
      # tests/conftest.py runs the suite on this database (migrated by alembic, truncated after
      # each test) instead of in-memory SQLite.
      TL_TEST_DATABASE_URL: postgresql+asyncpg://tl:tl@localhost:5432/therapylink
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Migrate an empty database to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head
      - name: Models match the migrations
        run: alembic check
      - run: python -m pytest -q

  # The image production runs: it must build, migrate an empty Postgres through its release entry,
  # serve with TL_ENV=prod, and carry no fixable CRITICAL vulnerability.
  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tl
          POSTGRES_PASSWORD: tl
          POSTGRES_DB: therapylink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tl -d therapylink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: therapylink-api:ci
      TL_DATABASE_URL: postgresql+asyncpg://tl:tl@localhost:5432/therapylink
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t "$IMAGE" api
      # --network host: the container reaches the Postgres service on the runner's localhost.
      - name: Release (migrate) against Postgres
        run: docker run --rm --network host -e TL_ENV=prod -e TL_DATABASE_URL "$IMAGE" release
      - name: Serve and answer health checks
        run: |
          docker run -d --name api --network host -e TL_ENV=prod -e TL_DATABASE_URL -e PORT=7860 "$IMAGE" serve
          for _ in $(seq 30); do
            curl -sf http://localhost:7860/health && break
            sleep 1
          done
          curl -sf http://localhost:7860/health
          curl -sf http://localhost:7860/ready
      - name: Server log
        if: always()
        run: docker logs api || true
      - name: Install trivy
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" trivy
      # --ignore-unfixed: a CRITICAL with no patched package yet can't be acted on here and would
      # only turn the gate permanently red. Anything with a fix fails the build.
      - name: Scan the image
        run: ./trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      # CPU-only torch first, so nothing below pulls the multi-GB CUDA build. The rest is what the
      # tests import; GPU-only training stacks (unsloth, bitsandbytes, llama-cpp) are left out.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          pip install transformers peft scikit-learn pandas numpy datasets huggingface_hub
          pydantic typer rich requests pytest ruff
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: python -m pytest -q

  # Whole-history secret scan, on every run whatever changed. Any finding fails the build.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      # gitleaks skips binary files in commits, so a keystore added to history would pass the scan
      # above. This lists every file name ever added and fails on credential files by name alone.
      - name: No credential files anywhere in history
        run: |
          forbidden='(^|/)(\.env(\.[^/]+)?|key\.properties)$|\.(jks|keystore|p12|pfx)$|(^|/)[^/]*(service[-_]?account|firebase[-_]adminsdk)[^/]*\.json$'
          allowed='(^|/)\.env\.(example|sample|template)$'
          found=$(git log --all --format= --name-only --diff-filter=ACR | sort -u | grep -Ei "$forbidden" | grep -Eiv "$allowed" || true)
          if [ -n "$found" ]; then
            echo "::error title=secrets::Credential files were committed. Revoke what they hold, then remove them from history:"
            echo "$found"
            exit 1
          fi
          echo "No credential files in history."

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
      # The runner image ships shellcheck, so run: blocks are linted too.
      - run: ./actionlint -color

  # The one check branch protection needs. A job skipped by its path filter counts as passed; a
  # failed or cancelled one does not.
  ci-ok:
    if: always()
    needs: [changes, app, app-build, api, api-postgres, api-image, ml, secrets, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with: $r"; exit 1 ;;
            esac
          done
