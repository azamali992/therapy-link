name: therapylink
description: A mental-health companion for English and Roman Urdu speakers in Pakistan.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.13.3

# Versions match the v16 build that ran on the owner's phone (see the APK recovery report).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state & navigation
  flutter_riverpod: ^3.3.2
  go_router: ^16.3.0

  # auth
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

  # network
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # local storage: chats and journal never leave the device; SQLCipher via sqlite3 hooks
  drift: ^2.34.4
  sqlite3: ^3.6.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # security
  local_auth: ^3.0.2
  crypto: ^3.0.7

  # on-device safety classifier (Guardian)
  flutter_onnxruntime: ^1.8.5

  # ui
  fl_chart: ^1.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  equatable: ^2.1.0
  mutex: ^3.1.0
  logging: ^1.3.0

  # 3D presence widgets (eve-presence branch)
  video_player: ^2.9.3
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.15

# package:sqlite3 3.x bundles SQLite through a build hook; this picks its SQLCipher build on every
# platform so the database file is encrypted at rest. core/db/encrypted_database.dart refuses to
# open a file unless PRAGMA cipher_version answers, so a build that silently lost this still fails loud.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/3d/eve-idle.mp4
    - assets/3d/eve-listening.mp4
    - assets/3d/eve-thinking.mp4
    - assets/3d/breath-box.mp4
    - assets/3d/eve-idle-360.mp4
    - assets/3d/eve-listening-360.mp4
    - assets/3d/eve-thinking-360.mp4
    - assets/3d/breath-box-360.mp4
    - assets/3d/eve.png
    - assets/3d/breath.png
    - assets/3d/eve-hero.png

  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 100
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 200
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 300
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 400
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 500
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 600
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 700
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 800
        - asset: assets/fonts/Unbounded/Unbounded[wght].ttf
          weight: 900

    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 100
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 200
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 300
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext[wght].ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Italic[wght].ttf
          weight: 400
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Italic[wght].ttf
          weight: 700
          style: italic

    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono/AtkinsonHyperlegibleMono[wght].ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleMono/AtkinsonHyperlegibleMono[wght].ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleMono/AtkinsonHyperlegibleMono[wght].ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleMono/AtkinsonHyperlegibleMono[wght].ttf
          weight: 700

    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu/NotoNastaliqUrdu[wght].ttf
          weight: 400
        - asset: assets/fonts/NotoNastaliqUrdu/NotoNastaliqUrdu[wght].ttf
          weight: 500
        - asset: assets/fonts/NotoNastaliqUrdu/NotoNastaliqUrdu[wght].ttf
          weight: 600
        - asset: assets/fonts/NotoNastaliqUrdu/NotoNastaliqUrdu[wght].ttf
          weight: 700
